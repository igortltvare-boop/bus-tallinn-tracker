name: Update Tallinn bus timetables

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Download Tallinn GTFS
        run: |
          mkdir -p data
          curl -fL "https://eu-gtfs.remix.com/tallinn.zip" -o /tmp/tallinn.zip

      - name: Build route timetables
        run: |
          python - <<'PY'
          import csv
          import io
          import zipfile
          import json
          import os
          import re
          from datetime import datetime, timezone

          with zipfile.ZipFile("/tmp/tallinn.zip") as z:
              names = set(z.namelist())

              def read_csv(filename):
                  with z.open(filename) as f:
                      text = f.read().decode("utf-8-sig")
                  return list(csv.DictReader(io.StringIO(text)))

              routes = read_csv("routes.txt")
              trips = read_csv("trips.txt")
              stop_times = read_csv("stop_times.txt")
              stops = read_csv("stops.txt")

              calendar = read_csv("calendar.txt") if "calendar.txt" in names else []
              exceptions = read_csv("calendar_dates.txt") if "calendar_dates.txt" in names else []

          os.makedirs("data/routes", exist_ok=True)

          trips_by_id = {t["trip_id"]: t for t in trips}
          times_by_trip = {}

          for row in stop_times:
              times_by_trip.setdefault(row["trip_id"], []).append({
                  "stop_id": row["stop_id"],
                  "arrival": row.get("arrival_time", ""),
                  "departure": row.get("departure_time", ""),
                  "sequence": int(row["stop_sequence"])
              })

          for trip_id in times_by_trip:
              times_by_trip[trip_id].sort(key=lambda x: x["sequence"])

          trips_by_route = {}

          for trip in trips:
              route_id = trip["route_id"]
              if trip["trip_id"] in times_by_trip:
                  trips_by_route.setdefault(route_id, []).append({
                      "trip_id": trip["trip_id"],
                      "service_id": trip["service_id"],
                      "headsign": trip.get("trip_headsign", ""),
                      "direction_id": trip.get("direction_id", ""),
                      "shape_id": trip.get("shape_id", ""),
                      "stops": times_by_trip[trip["trip_id"]]
                  })

          manifest = []

          for route in routes:
              route_id = route["route_id"]
              route_trips = trips_by_route.get(route_id, [])

              if not route_trips:
                  continue

              filename = re.sub(r"[^a-zA-Z0-9_-]", "_", route_id) + ".json"

              data = {
                  "route": route,
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "trips": route_trips
              }

              with open("data/routes/" + filename, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, separators=(",", ":"))

              manifest.append({
                  "route_id": route_id,
                  "route_number": route.get("route_short_name", ""),
                  "route_name": route.get("route_long_name", ""),
                  "file": filename,
                  "trip_count": len(route_trips)
              })

          with open("data/routes/index.json", "w", encoding="utf-8") as f:
              json.dump({
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "routes": manifest
              }, f, ensure_ascii=False, separators=(",", ":"))

          with open("data/stops.json", "w", encoding="utf-8") as f:
              json.dump(stops, f, ensure_ascii=False, separators=(",", ":"))

          with open("data/calendar.json", "w", encoding="utf-8") as f:
              json.dump({
                  "calendar": calendar,
                  "exceptions": exceptions
              }, f, ensure_ascii=False, separators=(",", ":"))

          if os.path.exists("data/gtfs.json"):
              os.remove("data/gtfs.json")

          print("Routes created:", len(manifest))
          print("Trips created:", sum(r["trip_count"] for r in manifest))
          print("Stops:", len(stops))
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Build Tallinn route timetables" || echo "No changes"
          git push
