name: Update Tallinn bus timetables

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Download Tallinn GTFS
        run: |
          mkdir -p data
          curl -L "https://eu-gtfs.remix.com/tallinn.zip" -o /tmp/tallinn.zip

      - name: Prepare timetable data
        run: |
          python - <<'PY'
          import zipfile, json, os
          from datetime import datetime

          with zipfile.ZipFile("/tmp/tallinn.zip") as z:
              files = {}
              for name in ["routes.txt", "trips.txt", "stop_times.txt",
                           "stops.txt", "calendar.txt", "calendar_dates.txt"]:
                  if name in z.namelist():
                      files[name] = z.read(name).decode("utf-8-sig")

          os.makedirs("data", exist_ok=True)
          with open("data/gtfs.json", "w", encoding="utf-8") as f:
              json.dump({
                  "updated": datetime.utcnow().isoformat() + "Z",
                  "files": files
              }, f, ensure_ascii=False)

          print("GTFS data downloaded successfully")
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gtfs.json
          git commit -m "Update Tallinn timetables" || echo "No changes"
          git push
