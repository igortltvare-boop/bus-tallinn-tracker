
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tallinn Bus Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}
header{background:#173c59;color:white;padding:18px}
h1{font-size:25px;margin:0 0 6px}
main{padding:12px;max-width:850px;margin:auto}
.panel{background:white;padding:16px;border-radius:13px;margin-bottom:13px}
h2{font-size:21px;margin:0 0 13px}
input,button{width:100%;min-height:54px;font-size:19px;padding:10px;border-radius:9px;margin:5px 0}
input{border:2px solid #9aa9b5}
button{background:#17669b;color:white;border:0;font-weight:bold}
#map{height:400px;border-radius:10px}
#routes{display:flex;gap:8px;flex-wrap:wrap}
.route{background:#e5edf4;padding:9px;border-radius:8px;font-size:18px;font-weight:bold}
.route button{width:auto;min-height:35px;padding:4px 10px;margin-left:6px;background:#a33}
.status{font-size:17px;line-height:1.5}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{font-size:16px;font-weight:bold;display:flex;align-items:center;gap:9px}
.dot{width:22px;height:22px;border-radius:50%}
.green{background:#168447}.red{background:#d93636}
.blue{background:#287bd1}.gray{background:#888}
.busicon{border:3px solid white;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:15px;box-shadow:0 1px 5px #555}
@media(max-width:450px){#map{height:350px}.legend{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>🚌 Tallinn Bus Tracker</h1>
Контроль движения автобусов Таллинна
</header>
<main>

<section class="panel">
<h2>Выбор маршрутов (до 3)</h2>
<input id="routeInput" type="number" min="1" placeholder="Номер маршрута">
<button onclick="addRoute()">Добавить маршрут</button>
<div id="routes"></div>
</section>

<section class="panel">
<h2>Карта Таллинна</h2>
<div id="map"></div>
<p id="gpsStatus" class="status">Подключение к GPS...</p>
</section>

<section class="panel">
<h2>Цвета автобусов</h2>
<div class="legend">
<div class="item"><span class="dot green"></span>По графику ±1 мин</div>
<div class="item"><span class="dot red"></span>Раньше графика</div>
<div class="item"><span class="dot blue"></span>Опаздывает</div>
<div class="item"><span class="dot gray"></span>Нет информации</div>
</div>
</section>

<section class="panel">
<h2>Передача смены</h2>
<input id="busSearch" placeholder="Бортовой номер">
<button onclick="trackBus()">Найти автобус</button>
<p id="handoverStatus" class="status">Выбери автобус.</p>
</section>

<section class="panel">
<h2>Пересадки</h2>
<p>Расчёт пересадок подключим после расписаний.</p>
</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([59.437,24.7536],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

let selectedRoutes=['18'];
let markers={};
let trackedBus='';
let busy=false;

function addRoute(){
 const input=document.getElementById('routeInput');
 const v=input.value.trim();
 if(!v){alert('Введите номер маршрута');return}
 if(selectedRoutes.includes(v)){alert('Уже выбран');return}
 if(selectedRoutes.length>=3){alert('Максимум три маршрута');return}
 selectedRoutes.push(v);
 input.value='';
 renderRoutes();
 updateBuses();
}

function removeRoute(v){
 selectedRoutes=selectedRoutes.filter(x=>x!==v);
 renderRoutes();
 updateBuses();
}

function renderRoutes(){
 const box=document.getElementById('routes');
 box.innerHTML='';
 selectedRoutes.forEach(v=>{
  const el=document.createElement('div');
  el.className='route';
  const label=document.createElement('span');
  label.textContent='Маршрут № '+v;
  const btn=document.createElement('button');
  btn.textContent='×';
  btn.onclick=()=>removeRoute(v);
  el.append(label,btn);
  box.append(el);
 });
}

function position(bus){
 const lat=Number(bus.lat);
 const lon=Number(bus.lon);
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
 if(lat<58||lat>60||lon<21||lon>29)return null;
 return [lat,lon];
}

async function updateBuses(){
 if(busy)return;
 busy=true;
 const status=document.getElementById('gpsStatus');

 try{
  const response=await fetch(
   'https://nordapi.ee/api/v1/estonian-transport/tlt/vehicles',
   {cache:'no-store'}
  );

  if(!response.ok){
   throw new Error('Сервер ответил: '+response.status);
  }

  const data=await response.json();
  const vehicles=data.data?.vehicles;

  if(!Array.isArray(vehicles)){
   throw new Error('В ответе нет списка автобусов');
  }

  const buses=vehicles.filter(bus=>
   String(bus.type)==='2' &&
   selectedRoutes.includes(String(bus.line)) &&
   position(bus)!==null
  );

  const active=new Set();

  buses.forEach(bus=>{
   const id=String(bus.vehicle_id);
   const route=String(bus.line);
   const pos=position(bus);
   active.add(id);

   const icon=L.divIcon({
    className:'',
    html:'<div class="busicon" style="background:#888">'+route+'</div>',
    iconSize:[44,44],
    iconAnchor:[22,22]
   });

   const popup=
    '<b>Автобус № '+route+'</b><br>'+
    'Бортовой номер: '+id+'<br>'+
    'Направление: '+(bus.destination||'Не указано')+
    '<br>GPS получен';

   if(markers[id]){
    markers[id].setLatLng(pos);
    markers[id].setIcon(icon);
    markers[id].setPopupContent(popup);
   }else{
    markers[id]=L.marker(pos,{icon}).addTo(map).bindPopup(popup);
   }
  });

  Object.keys(markers).forEach(id=>{
   if(!active.has(id)){
    map.removeLayer(markers[id]);
    delete markers[id];
   }
  });

  status.textContent=
   'GPS обновлён: '+new Date().toLocaleTimeString('ru-RU')+
   '. Найдено автобусов: '+buses.length+
   '. Маршруты: '+selectedRoutes.join(', ');

  if(trackedBus&&markers[trackedBus]){
   map.setView(markers[trackedBus].getLatLng(),15);
  }

 }catch(error){
  status.textContent='Ошибка: '+error.message;
  console.error(error);
 }finally{
  busy=false;
 }
}

function trackBus(){
 const id=document.getElementById('busSearch').value.trim();
 const info=document.getElementById('handoverStatus');
 if(!id){info.textContent='Введи бортовой номер';return}
 if(markers[id]){
  trackedBus=id;
  map.setView(markers[id].getLatLng(),16);
  markers[id].openPopup();
  info.textContent='Автобус найден. Отслеживание включено.';
 }else{
  info.textContent='Автобус не найден среди выбранных маршрутов.';
 }
}

renderRoutes();
updateBuses();
setInterval(updateBuses,10000);
</script>
</body>
</html>
